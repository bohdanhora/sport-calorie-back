services:
  postgres:
    image: postgres:17-alpine
    container_name: sport-calorie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sport_calorie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-sport_calorie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sport_calorie_user} -d ${POSTGRES_DB:-sport_calorie}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sport-calorie

  api:
    build:
      context: .
      target: production
    container_name: sport-calorie-api
    restart: unless-stopped
    profiles:
      - api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sport_calorie_user}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-sport_calorie}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    networks:
      - sport-calorie

volumes:
  postgres-data:

networks:
  sport-calorie:
    driver: bridge
